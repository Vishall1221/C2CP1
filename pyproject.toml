[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "c2c-phase-one"
version = "0.1.0"
description = "Extract evidence-linked outfit metadata from an MP4"
requires-python = ">=3.11,<3.14"
dependencies = [
    "av>=16,<20",
    "filelock>=3.18,<4",
    "google-genai==3.4.0",
    "numpy>=2.0.2,<3",
    "opencv-python>=4.11,<5",
    "pydantic>=2.11,<3",
    "rfdetr==1.12.1",
    "scenedetect==0.7.3",
    "streamlit>=1.56,<2",
    "supervision>=0.31,<0.32",
    "trackers==2.7.0",
    "truststore>=0.10.5,<1",
]

[project.scripts]
c2c = "c2c.cli:main"

[tool.setuptools.packages.find]
include = ["c2c*"]

[tool.setuptools.package-data]
c2c = ["prompts/*.txt"]

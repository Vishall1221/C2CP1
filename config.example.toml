[vertex]
project_id = "your-google-cloud-project-id"
location = "global"
model = "gemini-3.8-flash"
# Set to "default" if your configured model does not support high media resolution.
media_resolution = "high"

[video]
sample_fps = 6.0  # Set to 0 to process every source frame for a short comparison.
device = "auto"   # Apple Silicon: MPS when available. CPU fallback.

[extraction]
views_per_batch = 4  # Distinct source frames. Detail crops are attached separately.
detail_crops = true
verify_attributes = true
compare_repeats = true
